# Конфигурация для Render.com (бесплатный тариф)
services:
  - type: web
    name: portfolio-russia
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
